[package]
name = "vaporwave-racer"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "=0.19.0"

# Bevy's recommended dev setup. Full debug info for Bevy made the dev binary
# ~1.6 GB and the final link step take minutes.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Dependencies are optimized (compiled once, cached) and carry no debug info.
[profile.dev.package."*"]
opt-level = 3
debug = false

# For measuring real performance: `cargo run --release`.
# Thin LTO gives most of full LTO's speed-up with a much shorter link.
[profile.release]
lto = "thin"
